name: Build Trojan Release (amd64 + arm64)

on:
  workflow_dispatch: {}   # 手动运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.20'

      - name: Build amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -o trojan-linux-amd64 ./main.go
          sha256sum trojan-linux-amd64 > trojan-linux-amd64.dgst

      - name: Build arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -o trojan-linux-arm64 ./main.go
          sha256sum trojan-linux-arm64 > trojan-linux-arm64.dgst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trojan-build
          path: |
            trojan-linux-amd64
            trojan-linux-amd64.dgst
            trojan-linux-arm64
            trojan-linux-arm64.dgst
